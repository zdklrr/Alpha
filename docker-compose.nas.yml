# ─────────────────────────────────────────────────────────────
# Alpha @ NAS —— 群晖 / 威联通 / 斐乐纳 / 自建盒子通用
# 宿主机端口 923（即你说的 0923）→ 容器内 18888
#
# 启动：
#   cd <你的 Alpha 文件夹>
#   cp .env.nas.template .env      # 首次，填 ALPHA_WRITE_TOKEN
#   docker compose -f docker-compose.nas.yml up -d --build
# ─────────────────────────────────────────────────────────────

services:
  alpha:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpha:zdklrr
    container_name: alpha
    # 宿主机 0.0.0.0:923 —— 局域网内可用手机/电脑访问
    # ⚠️ 本版本 API 无内置鉴权：写操作受 ALPHA_WRITE_TOKEN 保护，
    #    请务必在 .env 里设置一个强随机 token；只读接口仍是开放的。
    ports:
      - "923:18888"
    env_file:
      - .env
    environment:
      # 容器内必须绑 0.0.0.0（对外暴露面由上面的端口映射控制）
      HOST: 0.0.0.0
      PORT: "18888"
      RELOAD: "0"
      # 注意：这里刻意不设置 ALPHA_TRUST_EDGE —— 端口对局域网开放时不能信任来源
    volumes:
      # ⚠️ 数据库必须放命名卷（ext4）：SQLite WAL 在 bind mount（尤其 macOS/Windows）
      #    上有页级损坏风险。需要取数据时用 `docker compose cp alpha:/app/data/xxx .`
      - alpha_data:/app/data
      - ./logs:/app/logs
      # Kronos 权重缓存持久化（避免每次重建容器重复下载 ~300MB）
      - alpha_hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:18888/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  alpha_data:
    name: alpha_data
  alpha_hf_cache:
    name: alpha_hf_cache
